[bot]
bot_group_id = 0
generate_status_avatar = true
set_status_description = true
language = "en"
run = true

[bot.commands]
matcher = "ic3"
long_message = "Split"
long_message_split_limit = 2
color = true
command_complexity = 64

[bot.commands.alias]
# Radio stations by number (!radio 1, !radio 2, ... and !r 1, !r 2, ...)
"radio 1" = "play https://live.hunter.fm/lofi_high"
"radio 2" = "play https://streams.fluxfm.de/chillhop/mp3-320/audio/"
"radio 3" = "play https://play.streamafrica.net/lofi-hip-hop"
"radio 4" = "play https://stream.nightride.fm/chillsynth.mp3"
"radio 5" = "play https://hls-01-radiorecord.hostingradio.ru/record/playlist.m3u8"
"radio 6" = "play http://dfm.hostingradio.ru/dfm128.mp3"
"radio 7" = "play http://ep128.hostingradio.ru:8030/ep128"
"radio 8" = "play http://pub0102.101.ru:8000/stream/air/aac/64/99"
"radio 9" = "play http://pub0102.101.ru:8000/stream/air/aac/64/200"
"radio 10" = "play https://nashe1.hostingradio.ru/nashe-128.mp3"
"radio 11" = "play https://radio-holding.ru:9433/marusya_default"

"r 1" = "play https://live.hunter.fm/lofi_high"
"r 2" = "play https://streams.fluxfm.de/chillhop/mp3-320/audio/"
"r 3" = "play https://play.streamafrica.net/lofi-hip-hop"
"r 4" = "play https://stream.nightride.fm/chillsynth.mp3"
"r 5" = "play https://hls-01-radiorecord.hostingradio.ru/record/playlist.m3u8"
"r 6" = "play http://dfm.hostingradio.ru/dfm128.mp3"
"r 7" = "play http://ep128.hostingradio.ru:8030/ep128"
"r 8" = "play http://pub0102.101.ru:8000/stream/air/aac/64/99"
"r 9" = "play http://pub0102.101.ru:8000/stream/air/aac/64/200"
"r 10" = "play https://nashe1.hostingradio.ru/nashe-128.mp3"
"r 11" = "play https://radio-holding.ru:9433/marusya_default"

# Radio stations by name
lofi = "play https://live.hunter.fm/lofi_high"
chillhop = "play https://streams.fluxfm.de/chillhop/mp3-320/audio/"
record = "play https://hls-01-radiorecord.hostingradio.ru/record/playlist.m3u8"
dfm = "play http://dfm.hostingradio.ru/dfm128.mp3"
europa = "play http://ep128.hostingradio.ru:8030/ep128"
energy = "play http://pub0102.101.ru:8000/stream/air/aac/64/99"
relax = "play http://pub0102.101.ru:8000/stream/air/aac/64/200"
nashe = "play https://nashe1.hostingradio.ru/nashe-128.mp3"
marusya = "play https://radio-holding.ru:9433/marusya_default"

# English command shortcuts
p = "play"
s = "stop"
n = "next"
skip = "next"
q = "list"
queue = "list"
vol = "volume"
np = "song"

[bot.connect]
server_password = { pw = "", hashed = false, autohash = false }
channel_password = { pw = "", hashed = false, autohash = false }
client_version = { build = "", platform = "", sign = "" }
address = "127.0.0.1"
channel = ""
badges = ""
name = "MusicBot"

[bot.connect.identity]
key = ""
offset = 0
level = -1

[bot.reconnect]
ontimeout = ["1s", "2s", "5s", "10s", "30s", "1m", "5m", "repeat last"]
onkick = ["3s", "repeat last"]
onban = []
onerror = ["30s", "repeat last"]
onshutdown = ["5m"]

[bot.audio]
volume = { default = 50.0, min = 0.0, max = 100.0 }
max_user_volume = 100.0
bitrate = 64
send_mode = "voice"

[bot.playlists]

[bot.history]
enabled = true
fill_deleted_ids = true

[bot.events]
onconnect = ""
ondisconnect = ""
onidle = ""
idletime = "0s"
onalone = ""
alone_delay = "0s"
onparty = ""
party_delay = "0s"
onsongstart = ""

[configs]
bots_path = "bots"
send_stats = false

[db]
path = "ts3audiobot.db"

[factories]
media = { path = "" }

[factories.youtube]
prefer_resolver = "Youtubedl"
youtube_api_key = ""

[tools]
youtube-dl = { path = "/usr/local/bin/yt-dlp" }

[tools.ffmpeg]
path = "/usr/bin/ffmpeg"

[rights]
path = "rights.toml"

[plugins]
path = "plugins"

[plugins.load]

[web]
hosts = ["*"]
port = 58913

[web.api]
enabled = true
command_complexity = 64
matcher = "exact"

[web.interface]
enabled = true
path = "WebInterface"
