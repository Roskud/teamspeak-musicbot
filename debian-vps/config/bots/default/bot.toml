run = true

[connect]
address = "127.0.0.1"
name = "🎵 MusicBot"

[connect.identity]
key = ""
offset = 0
level = -1

[audio]
volume = { default = 50.0, min = 0.0, max = 100.0 }
max_user_volume = 100.0
bitrate = 64
send_mode = "voice"

[commands]
matcher = "exact"

[commands.alias]
# Subcommands for !radio <1..11>
"radio 1" = "!play https://live.hunter.fm/lofi_high"
"radio 2" = "!play https://streams.fluxfm.de/chillhop/mp3-320/audio/"
"radio 3" = "!play https://play.streamafrica.net/lofi-hip-hop"
