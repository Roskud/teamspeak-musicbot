# Rights declaration file
# For more information about syntax and structure see here:
# https://github.com/Splamy/TS3AudioBot/wiki/Rights

# Default rights for any client
"+" = [
	# Song info in private chat
	"cmd.song"
]

# Admin rule for localhost (WebAPI)
[[rule]]
	ip = [ "127.0.0.1", "::1", "::ffff:127.0.0.1" ]
	"+" = "*"

[[rule]]
	isapi = true
	"+" = "*"

# Admin rule for ServerAdmin groups (group 2: Query Admin, group 6: Server Admin)
[[rule]]
	groupid = [ 2, 6 ]
	"+" = "*"

# Admin rule for ServerQuery client
[[rule]]
	useruid = [ "serveradmin" ]
	"+" = "*"

# Full playback rights in Private Message (used by YandexBridge to control the player quietly)
[[rule]]
	visibility = [ "Private" ]
	"+" = [
		"cmd.play",
		"cmd.pause",
		"cmd.stop",
		"cmd.seek",
		"cmd.volume",
		"cmd.next",
		"cmd.previous",
		"cmd.bot.avatar.*",
		"cmd.song",
		"cmd.clear"
	]

# Block commands from Channel and Server chat to prevent duplicate bot replies and error messages.
# All channel user commands (!play, !stop, !radio, etc.) are handled cleanly by YandexBridge.
[[rule]]
	visibility = [ "Channel", "Server" ]
	"-" = "*"
